name: Component interaction verification
on:
  push:
    branches: [feat/parts-clipboard-wasd]
    paths: [.ci/parts-ready]
permissions:
  contents: write
concurrency:
  group: formula-alchemy-parts-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply only exact baseline-checked source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, base64, lzma
          root=Path.cwd().resolve()
          data=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in sorted(Path('.ci').glob('parts-delta-*.txt')))))
          assert hashlib.sha256(data).hexdigest()=='e3d95cb0e13efc757bf1adebb3e86f6523c8d81a3e7bad59c6329567523cd096'
          changes=json.loads(data)
          assert len(changes)==34 and len({c['path'] for c in changes})==34
          prepared=[]
          for c in changes:
              path=(root/c['path']).resolve()
              assert path.is_relative_to(root) and not path.is_relative_to(root/'.git') and not path.is_relative_to(root/'.github')
              before=path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(before).hexdigest()==c['base'], f'Stale baseline: {path}'
              lines=before.decode().splitlines(keepends=True)
              for start,end,replacement in reversed(c['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=replacement.splitlines(keepends=True)
              prepared.append((path,''.join(lines)))
          for path,text in prepared:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text)
          print('Applied 34 files against exact main 809269c; audio remains untouched.')
          PY
      - run: npm ci
      - name: Typecheck, unit and physics tests, production build
        run: npm run check 2>&1 | tee /tmp/parts-check.log
      - name: Verify Pages resources and unchanged sounds
        run: |
          npm run verify:dist
          test -z "$(git diff --name-only -- public/audio src/audio)"
      - run: npx playwright install --with-deps chromium
      - name: Real HTTP browser interactions, desktop and mobile
        run: npx playwright test --retries=0 2>&1 | tee /tmp/parts-e2e.log
      - name: Commit validated source to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .ci/parts-ready .ci/parts-delta-*.txt .github/workflows/parts-verify.yml
          git add src tests e2e README.md package.json package-lock.json
          git commit -m 'Add direct component interaction, native clipboard, Q/WASD and unbounded held drag; prevent residual spin'
          git push origin HEAD:feat/parts-clipboard-wasd
          git rev-parse HEAD
      - name: Package verified source without dependencies or font binaries
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import subprocess
          with ZipFile('verified-parts-source.zip','w',ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  p=Path(name)
                  if p.is_file() and not name.startswith('.ci/') and p.suffix not in ['.ttf','.otf','.woff','.woff2']:
                      z.write(p,'formula-alchemy/'+name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parts-qa-results
          path: |
            verified-parts-source.zip
            test-results
            playwright-report
            /tmp/parts-check.log
            /tmp/parts-e2e.log
          retention-days: 7
